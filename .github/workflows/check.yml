name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression suites
        run: python3 tools/check.py
      - name: Verify skill package is fresh
        run: |
          python3 tools/package.py
          (cd dist && sha256sum -c collabmd.skill.sha256)
